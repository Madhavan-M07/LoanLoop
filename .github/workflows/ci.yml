# CI: runs on every push to main (we commit directly to main, so this is the safety net).
# Fails if any check fails: secrets, lint, format, types, tests (incl. layer-architecture test).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the latest commit
      - name: Project scanner (all tracked files)
        run: python3 scripts/secret_scan.py --all
      - name: Gitleaks (broader ruleset, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres for the database tests (migrations, constraints, the whole store-based suite
    # on Postgres, persistence). Throwaway CI-only password; nothing secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loanloop
          POSTGRES_PASSWORD: loanloop_ci
          POSTGRES_DB: loanloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loanloop -d loanloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOANLOOP_TEST_DATABASE_URL: postgresql+asyncpg://loanloop:loanloop_ci@127.0.0.1:5432/loanloop
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --all-packages --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy backend/app

      - name: Backend tests (includes layer-architecture contract)
        working-directory: backend
        run: uv run pytest -q

      - name: Secret scanner tests
        run: uv run pytest -q scripts/tests
