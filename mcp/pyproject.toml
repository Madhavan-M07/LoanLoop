[project]
name = "loanloop-mcp"
version = "0.1.0"
description = "LoanLoop MCP server: scoped tools for OpenClaw (borrower) and Hermes (processor)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.20",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["loanloop-backend"]

[tool.uv.sources]
loanloop-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loanloop_mcp"]
